<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUGEN · styles des cases</title>
<style>
body{margin:0;background:#0d1016;color:#fff;font-family:Inter,system-ui,sans-serif;padding:18px}
h1{font:900 24px Inter;margin:4px 0 2px}p.i{color:#aab;margin:0 0 8px;font-size:14px}
h2{font:900 20px Inter;margin:26px 0 4px}h2 small{display:block;font:600 13px Inter;color:#9aa;margin-top:3px}
.g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:1180px}
@media(max-width:760px){.g{grid-template-columns:repeat(2,minmax(0,1fr))}}
.t{position:relative;aspect-ratio:2/1;border-radius:14px;overflow:hidden;border:1px solid #ffffff1c;background:#151922}
.t .tx{position:absolute;left:12px;bottom:10px;right:12px;text-shadow:0 2px 8px #000c;z-index:3}
.t b{display:block;font:900 16px Inter}.t span{font:600 12px Inter;opacity:.85}
.t i{position:absolute;right:10px;top:8px;font:900 15px 'Noto Serif JP',serif;font-style:normal;color:#2ee67a;z-index:3}
/* 1 vraies images */
.s1 .t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:saturate(1.1)}
.s1 .t:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#000c 0%,#0006 45%,#0000 75%),linear-gradient(0deg,#000a,#0000 55%);z-index:2}
.s1 .t .nm{position:absolute;right:10px;bottom:8px;z-index:3;font:700 10px Inter;opacity:.7}
/* 2 simple */
.s2 .t{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,#12151d),#10131a 70%);border-color:color-mix(in srgb,var(--c) 40%,#ffffff10)}
.s2 .t .ic{position:absolute;right:16px;top:50%;transform:translateY(-55%);width:34%;aspect-ratio:1;display:grid;place-items:center;border-radius:24px;background:color-mix(in srgb,var(--c) 18%,#0000);color:var(--c)}
.s2 .t .ic svg{width:62%;height:62%}
.s2 .t .tx{text-shadow:none;bottom:auto;top:50%;transform:translateY(-50%);right:40%}.s2 .t b{font-size:17px}.s2 .t i{display:none}
.s2 .t .tx span{display:block;margin-top:4px;color:color-mix(in srgb,var(--c) 70%,#fff)}
/* 3 pixel */
.s3 .t canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.s3 .t b{font-family:'Courier New',monospace;letter-spacing:.02em;font-size:16px}.s3 .t{border-radius:4px;border:3px solid #000;box-shadow:0 0 0 2px #ffffff30}
/* 4 chibi */
.s4 .t svg{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>
<h1>Styles des cases du menu</h1><p class="i">4 propositions avec les mêmes 8 cases. Dis-moi laquelle tu préfères (ou un mélange).</p>
<div id="out"></div>
<script>
const T=[['Expéditions','Voyage dans les mondes','旅','#ff9a3c','Monkey D. Luffy'],['Tableau des contrats','Affiches et sceaux','掲','#ffd36a','Gon Freecss'],['Mémoire des âmes','Mini-jeu de paires','憶','#8a7dff','L Lawliet'],['Atelier','Fusion · Forge','鍛','#ff7a45','Edward Elric'],['Dojo d’entraînement','+1 niveau en 6 h','道','#2ee67a','Rock Lee'],['Qui est-ce ?','Devine le perso','謎','#4fa3ff','Conan Edogawa'],['Match rapide','Combat 3 contre 3','戦','#ff4d2e','Naruto Uzumaki'],['Classé','Monte au sommet','位','#ffcf3a','Goku']];
const IC=[`<path d="M3 20l6-10 4 6 3-4 5 8z" fill="currentColor"/><circle cx="17" cy="6" r="2.4" fill="currentColor"/>`,`<rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2"/>`,`<rect x="3" y="5" width="8" height="12" rx="2" fill="currentColor"/><rect x="13" y="7" width="8" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>`,`<path d="M4 14h12l3-3H7zM9 14v4h4v-4M6 20h10" fill="currentColor"/><path d="M15 3l5 5-2 2-5-5z" fill="currentColor"/>`,`<path d="M12 2l3 6 6 1-4.5 4 1 6.5L12 16l-5.5 3.5 1-6.5L3 9l6-1z" fill="currentColor"/>`,`<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.8-2.5 2-2.5 4M12 17v.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,`<path d="M4 20L18 6M6 6l14 14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M15 3h6v6M3 15v6h6" stroke="currentColor" stroke-width="2" fill="none"/>`,`<path d="M7 4h10v4a5 5 0 01-10 0zM12 13v4M8 20h8M7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4" stroke="currentColor" stroke-width="2" fill="none"/>`];
// chibi
function chibi(k,c){const skin='#ffd9b8',hair=['#2a1a10','#3a5a20','#1a1a1a','#d8a83a','#1a1a1a','#3a2a1a','#ffcc33','#1a1a1a'][k],sx=200,sy=58;
const prop=[`<path d="M120 150 Q160 120 200 140" stroke="#fff8" stroke-width="3" stroke-dasharray="6 5" fill="none"/><rect x="250" y="120" width="40" height="30" fill="#8a5a2a"/><path d="M245 120 h50 l-25 -22z" fill="#c23"/>`,`<rect x="255" y="70" width="70" height="90" rx="4" fill="#f3e2c0" stroke="#5b3a22" stroke-width="4"/><text x="290" y="125" text-anchor="middle" font-size="34" font-weight="900" fill="#c23" font-family="Noto Serif JP,serif">探</text>`,`<g transform="rotate(-12 270 110)"><rect x="248" y="78" width="44" height="64" rx="6" fill="#3b2a7a" stroke="#fff" stroke-width="3"/><text x="270" y="122" text-anchor="middle" font-size="30" fill="#fff">?</text></g><g transform="rotate(10 320 110)"><rect x="298" y="80" width="44" height="64" rx="6" fill="#fff" stroke="#3b2a7a" stroke-width="3"/><text x="320" y="124" text-anchor="middle" font-size="26" fill="#3b2a7a">✦</text></g>`,`<path d="M250 150 h70 l-8 -14 h20 l4-14 h-90z" fill="#555c66"/><rect x="275" y="150" width="20" height="20" fill="#555c66"/><g transform="rotate(-30 300 70)"><rect x="296" y="50" width="8" height="60" fill="#7a5030"/><rect x="282" y="40" width="36" height="16" rx="3" fill="#9aa3ad"/></g>`,`<g fill="#7a5030"><rect x="285" y="70" width="12" height="95"/><rect x="262" y="88" width="58" height="10"/><rect x="262" y="118" width="58" height="9"/></g>`,`<text x="300" y="140" text-anchor="middle" font-size="96" font-weight="900" fill="#ffffff" opacity=".9" font-family="Arial Black,Inter">?</text>`,`<g stroke-width="8" stroke-linecap="round"><path d="M250 160 L340 70" stroke="#ff4d2e"/><path d="M250 70 L340 160" stroke="#ffd36a"/></g>`,`<rect x="250" y="120" width="30" height="40" fill="#c89a30"/><rect x="280" y="95" width="30" height="65" fill="#ffd36a"/><rect x="310" y="130" width="30" height="30" fill="#c89a30"/><path d="M283 60 h24 v8 q0 14 -12 16 q-12 -2 -12 -16z" fill="#ffe27a"/>`][k];
return `<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="cb${k}" cx=".3" cy=".3" r="1"><stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="#151a2a"/></radialGradient></defs><rect width="400" height="200" fill="url(#cb${k})"/>${[...Array(18)].map((_,i)=>`<circle cx="${(i*67)%400}" cy="${(i*41)%120}" r="${1+i%3}" fill="#fff" opacity=".35"/>`).join('')}<g transform="translate(-80 0)">${prop}</g>
<g transform="translate(${sx-100} 0)"><ellipse cx="200" cy="186" rx="34" ry="6" fill="#0006"/><rect x="180" y="128" width="40" height="44" rx="14" fill="${c}"/><rect x="183" y="166" width="12" height="18" rx="5" fill="#2a2a3a"/><rect x="205" y="166" width="12" height="18" rx="5" fill="#2a2a3a"/><circle cx="200" cy="${sy+36}" r="44" fill="${skin}"/><path d="M156 ${sy+32} q4 -48 44 -50 q42 2 46 50 q-10 -18 -22 -22 q-6 14 -24 14 q-10 -8 -14 -16 q-14 8 -30 24z" fill="${hair}"/><ellipse cx="184" cy="${sy+44}" rx="7" ry="10" fill="#1a1a2a"/><ellipse cx="216" cy="${sy+44}" rx="7" ry="10" fill="#1a1a2a"/><circle cx="186" cy="${sy+40}" r="3" fill="#fff"/><circle cx="218" cy="${sy+40}" r="3" fill="#fff"/><ellipse cx="174" cy="${sy+58}" rx="6" ry="3" fill="#ff8a9a" opacity=".6"/><ellipse cx="226" cy="${sy+58}" rx="6" ry="3" fill="#ff8a9a" opacity=".6"/><path d="M194 ${sy+62} q6 6 12 0" stroke="#7a3a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="174" cy="150" r="9" fill="${skin}"/><circle cx="226" cy="150" r="9" fill="${skin}"/></g></svg>`}
// pixel art : scène dessinée en petit puis agrandie
function pixel(cv,k,c){const W=100,H=50,x=cv.getContext('2d');cv.width=W;cv.height=H;const sky=[['#ff9a62','#ffcf8a'],['#2b1a3a','#5b3a6a'],['#16204a','#3a4a9a'],['#2a120a','#5a2a14'],['#e9dcc0','#f6eedc'],['#101a40','#26306a'],['#3a0d12','#8a1a20'],['#2a1a00','#6a4a10']][k];
for(let y=0;y<H;y++){x.fillStyle=y<H*.33?sky[0]:y<H*.6?sky[1]:sky[1];x.fillRect(0,y,W,1)}
const P=(cx,cy,s,col)=>{x.fillStyle=col;x.fillRect(cx,cy,s[0],s[1])};
if(k==0){x.fillStyle='#7a2e52';for(let i=0;i<W;i++){const h=18+Math.abs(((i%34)-17))*0.9;x.fillRect(i,H-h,1,h)}x.fillStyle='#2b1430';x.fillRect(0,H-8,W,8);P(70,22,[2,12],'#e8384f');P(80,22,[2,12],'#e8384f');P(68,20,[16,2],'#e8384f');P(85,8,[5,5],'#ffd36a')}
if(k==1){P(30,10,[40,30],'#5b3a22');[0,1,2].forEach(i=>P(34+i*12,15+(i%2),[9,13],'#f3e2c0'));[0,1,2].forEach(i=>P(37+i*12,19+(i%2),[3,3],'#c23'));P(82,6,[5,5],'#f6eedc')}
if(k==2){P(72,6,[9,9],'#fff3c4');[0,1,2,3].forEach(i=>{P(14+i*16,22-(i%2)*3,[11,16],i%2?'#3b2a7a':'#283a8a');P(18+i*16,28-(i%2)*3,[3,3],'#fff3c4')})}
if(k==3){P(36,30,[26,6],'#3a3f48');P(44,36,[10,8],'#3a3f48');P(38,44,[22,3],'#5a4030');P(64,12,[3,16],'#7a5030');P(60,10,[11,5],'#9aa3ad');for(let i=0;i<8;i++)P(40+((i*13)%26),10+((i*7)%16),[1,1],'#ffb347')}
if(k==4){for(let i=0;i<5;i++){P(4+i*19,4,[16,30],'#f6eedc');x.fillStyle='#6b4a2a';x.fillRect(4+i*19,4,16,1);x.fillRect(4+i*19,19,16,1);x.fillRect(12+i*19,4,1,30)}P(0,34,[W,16],'#a8834f');P(74,22,[3,20],'#2a1d10');P(68,26,[15,3],'#2a1d10');P(68,32,[15,2],'#2a1d10')}
if(k==5){for(let i=0;i<12;i++){const h=12+((i*37)%18);P(i*9,H-h,[8,h],'#1d2b66');if(i%2)P(i*9+2,H-h+3,[1,1],'#ffd36a')}P(42,14,[16,22],'#2a2a4a');P(46,8,[8,8],'#2a2a4a');P(47,16,[6,2],'#c8d6ff');P(51,18,[2,4],'#c8d6ff');P(50,24,[2,2],'#c8d6ff')}
if(k==6){for(let i=0;i<30;i++){P(20+i*2,10+i,[2,2],'#ff4d2e');P(80-i*2,10+i,[2,2],'#ffd36a')}P(47,22,[6,6],'#fff')}
if(k==7){P(30,30,[14,16],'#7a5a1a');P(44,22,[14,24],'#c89a30');P(58,34,[14,12],'#7a5a1a');P(46,12,[10,6],'#ffe27a');P(49,18,[4,4],'#ffe27a')}
x.fillStyle='#0008';x.fillRect(0,H-14,W,14)}
const out=document.getElementById('out');
out.innerHTML=`<h2>1 · Vraies images d’anime<small>chaque case montre un vrai perso du jeu, en grand, lié au mode (images chargées depuis AniList, comme dans le jeu)</small></h2><div class="g s1">${T.map((t,k)=>`<div class="t"><img data-n="${t[4]}" alt=""><i>${t[2]}</i><div class="tx"><b>${t[0]}</b><span>${t[1]}</span></div><div class="nm">${t[4]}</div></div>`).join('')}</div>
<h2>2 · Simple et propre<small>case sombre, grande icône de couleur et dégradé, sans dessin, comme les applis modernes</small></h2><div class="g s2">${T.map((t,k)=>`<div class="t" style="--c:${t[3]}"><div class="ic"><svg viewBox="0 0 24 24">${IC[k]}</svg></div><div class="tx"><b>${t[0]}</b><span>${t[1]}</span></div></div>`).join('')}</div>
<h2>3 · Pixel art rétro<small>petites scènes en pixels façon jeu vidéo 16 bits</small></h2><div class="g s3">${T.map((t,k)=>`<div class="t"><canvas data-k="${k}"></canvas><i>${t[2]}</i><div class="tx"><b>${t[0]}</b><span>${t[1]}</span></div></div>`).join('')}</div>
<h2>4 · Chibi mignon<small>petits persos inventés style chibi, colorés, dans chaque case</small></h2><div class="g s4">${T.map((t,k)=>`<div class="t">${chibi(k,t[3])}<i>${t[2]}</i><div class="tx"><b>${t[0]}</b><span>${t[1]}</span></div></div>`).join('')}</div>`;
document.querySelectorAll('.s3 canvas').forEach(cv=>pixel(cv,+cv.dataset.k));
// vraies images depuis AniList
document.querySelectorAll('.s1 img').forEach(async im=>{try{const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:'query($s:String){Character(search:$s){image{large}}}',variables:{s:im.dataset.n}})});const j=await r.json();im.src=j.data.Character.image.large}catch(e){}});
</script></body></html>
