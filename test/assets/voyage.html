<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voyage</title>
<style>html,body{margin:0;height:100%;background:#0b0812;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}#c{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}
#hud{position:fixed;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:10px;font:800 11px ui-monospace,monospace;letter-spacing:1px;text-shadow:0 1px 6px #000}
#bar{flex:1;height:8px;border-radius:5px;background:#ffffff22;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ee67a,#ffd36a);box-shadow:0 0 10px #ffd36a}
#zone{position:fixed;left:14px;top:10px;font:900 15px Inter,sans-serif;letter-spacing:.5px;text-shadow:0 2px 10px #000;transition:opacity .4s}#zone small{display:block;font:800 9px ui-monospace,monospace;letter-spacing:3px;color:#ffd36a}
#arr{position:fixed;inset:0;display:grid;place-items:center;font:900 30px Inter,sans-serif;font-style:italic;text-shadow:0 0 30px #ffd36a,0 4px 0 #7a0a2a;opacity:0;transition:opacity .6s;pointer-events:none}</style></head><body>
<canvas id="c"></canvas><div id="zone"><small>VOYAGE · 旅</small><span id="zn">…</span></div><div id="hud"><span id="pc">0 %</span><div id="bar"><i></i></div><span id="tm"></span></div><div id="arr">ARRIVÉE !</div>
<script type="module">
import * as THREE from '../../lib/three.module.min.js';
const $=id=>document.getElementById(id),rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(1.5,devicePixelRatio));R.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,300);sc.fog=new THREE.Fog(0x1a1028,30,90);
const hemi=new THREE.HemisphereLight(0xffffff,0x332244,1.1);sc.add(hemi);const sun=new THREE.DirectionalLight(0xffe8c8,1.6);sun.position.set(-10,20,10);sc.add(sun);
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?62:42;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
// biomes : [nom, ciel, sol, sentier, accessoire, couleur accessoire]
const BI=[['Forêt des Feuilles','#ff9a6a','#3a6a24','#8a6a44','tree','#3f8a2a'],['Grand Line','#4aa0e8','#d8c088','#e8d8a8','palm','#2a9a5a'],['Tokyo · zone maudite','#3a2a5a','#2a2a34','#4a4a58','house','#7c4dff'],['Forêt des Glycines','#2a1a4a','#2a3a2a','#5a4a3a','wisteria','#b98cff'],['Terres désolées','#e8a060','#8a5a34','#a8784a','rock','#7a5a3a'],['Montagne enneigée','#a8c8e8','#e8eef8','#c8d0dc','pine','#2a4a3a'],['Désert des Sables','#ffcf8a','#e0b070','#f0d090','cactus','#4a8a3a'],['Cité céleste','#9be7ff','#e8f4ff','#ffffff','crystal','#9be7ff']];
const SEG=40,props=new THREE.Group();sc.add(props);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,flatShading:true},o));
function prop(k,col,x,z){const g=new THREE.Group();const s=rnd(.8,1.4);
 if(k=='tree'||k=='pine'||k=='wisteria'||k=='palm'){const t=new THREE.Mesh(new THREE.CylinderGeometry(.15,.25,k=='palm'?3:1.6,6),M('#5a3a22'));t.position.y=k=='palm'?1.5:.8;g.add(t);
  if(k=='pine')for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(1.1-i*.25,1.3,7),M(col));c.position.y=1.6+i*.7;g.add(c)}
  else if(k=='palm'){for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(1.8,.05,.35),M(col));l.position.set(Math.cos(i*1.26)*.7,3,Math.sin(i*1.26)*.7);l.rotation.y=-i*1.26;l.rotation.z=-.4;g.add(l)}}
  else{const c=new THREE.Mesh(new THREE.IcosahedronGeometry(k=='wisteria'?1.1:1,0),M(col,k=='wisteria'?{emissive:col,emissiveIntensity:.25}:{}));c.position.y=2.1;g.add(c)}}
 else if(k=='house'){const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,rnd(2,5),1.8),M('#3a3a48',{emissive:'#ffd36a',emissiveIntensity:.05}));b.position.y=b.geometry.parameters.height/2;g.add(b);const l=new THREE.PointLight(col,4,6);l.position.y=2;g.add(l)}
 else if(k=='rock'){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(.5,1.2),0),M(col));r.position.y=.4;g.add(r)}
 else if(k=='cactus'){const c=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,2,8),M(col));c.position.y=1;g.add(c);const a=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.8,6),M(col));a.position.set(.35,1.2,0);a.rotation.z=-1;g.add(a)}
 else if(k=='crystal'){const c=new THREE.Mesh(new THREE.OctahedronGeometry(rnd(.5,1),0),M(col,{emissive:col,emissiveIntensity:.6,roughness:.2,metalness:.3}));c.position.y=1.4;g.add(c)}
 g.position.set(x,0,z);g.scale.setScalar(s);g.rotation.y=rnd(0,6);return g}
// sol en tronçons
const ground=new THREE.Group();sc.add(ground);
function buildSeg(i){const b=BI[i%BI.length],g=new THREE.Group();g.userData.i=i;
 const gr=new THREE.Mesh(new THREE.PlaneGeometry(SEG,60),M(b[2]));gr.rotation.x=-Math.PI/2;gr.position.set(i*SEG+SEG/2,0,-10);g.add(gr);
 const pa=new THREE.Mesh(new THREE.PlaneGeometry(SEG,2.6),M(b[3]));pa.rotation.x=-Math.PI/2;pa.position.set(i*SEG+SEG/2,.01,0);g.add(pa);
 for(let k=0;k<26;k++){const x=i*SEG+rnd(0,SEG),z=rnd(-26,-3.5);g.add(prop(b[4],b[5],x,z))}
 if(i%2==1){const ev=new THREE.Group();const cv=document.createElement('canvas');cv.width=cv.height=128;const c2=cv.getContext('2d');c2.fillStyle='#000a';c2.beginPath();c2.arc(64,64,58,0,7);c2.fill();c2.strokeStyle='#ffd36a';c2.lineWidth=6;c2.stroke();c2.fillStyle='#ffd36a';c2.font='900 64px serif';c2.textAlign='center';c2.textBaseline='middle';c2.fillText(['宝','戦','泉','謎'][i%4],64,68);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));sp.scale.set(1.4,1.4,1);sp.position.set(i*SEG+SEG*.6,2.4,0);ev.add(sp);g.add(ev);g.userData.ev=sp}
 // arche d'entrée de zone
 const tor=new THREE.Group(),tm=M('#c0141c');[-1.8,1.8].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,3.4,8),tm);p.position.set(0,1.7,x);tor.add(p)});const top=new THREE.Mesh(new THREE.BoxGeometry(.3,.25,5),tm);top.position.y=3.4;tor.add(top);tor.position.x=i*SEG+.5;g.add(tor);
 ground.add(g);return g}
// équipe qui marche (cartes)
const team=new THREE.Group();sc.add(team);
function cardTex(n,c1,c2,k){const cv=document.createElement('canvas');cv.width=256;cv.height=384;const g=cv.getContext('2d');const l=g.createLinearGradient(0,0,0,384);l.addColorStop(0,c1);l.addColorStop(1,c2);g.fillStyle=l;g.fillRect(0,0,256,384);g.strokeStyle='#ffd36a';g.lineWidth=10;g.strokeRect(5,5,246,374);
 g.globalAlpha=.25;g.fillStyle='#fff';g.font='900 180px serif';g.textAlign='center';g.fillText(k||'旅',128,230);g.globalAlpha=1;g.fillStyle='#000a';g.fillRect(14,300,228,66);g.fillStyle='#fff';g.font='900 26px Inter,sans-serif';g.fillText(String(n).slice(0,14),128,342);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;return t}
let MEM=[];function setTeam(L){team.clear();MEM=(L&&L.length?L:[{n:'Équipe',c:'#7c4dff'}]).slice(0,3).map((m,i)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(1.6,2.4),new THREE.MeshStandardMaterial({map:cardTex(m.n,m.c||'#7c4dff','#120a18',m.k),side:2,roughness:.5,emissive:'#ffffff',emissiveIntensity:.08}));p.position.set(-i*2,1.5,i%2?.7:-.4);team.add(p);
 const sh=new THREE.Mesh(new THREE.CircleGeometry(.5,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));sh.rotation.x=-Math.PI/2;sh.position.set(-i*2,.02,p.position.z);team.add(sh);return p})}
setTeam();
let PROG=0,DONE=0,TOTAL=8,X=0,T=0,ZN=-1,last=performance.now(),arrived=0;const dust=[];
function ensure(){const cur=Math.floor(X/SEG);for(let i=cur-1;i<=cur+3;i++)if(i>=0&&!ground.children.some(g=>g.userData.i===i))buildSeg(i);ground.children.slice().forEach(g=>{if(g.userData.i<cur-1){ground.remove(g)}})}
const sky=new THREE.Color();
function frame(n){requestAnimationFrame(frame);const dt=Math.min(.05,(n-last)/1000);last=n;T+=dt;
 const target=DONE?TOTAL*SEG-6:Math.max(X,PROG*TOTAL*SEG);const sp=DONE&&X>=target?0:Math.max(2.2,(target-X)*.8);X=Math.min(DONE?target:1e9,X+sp*dt);ensure();
 team.position.x=X;MEM.forEach((p,i)=>{const ph=T*9+i*1.3;p.position.y=1.5+Math.abs(Math.sin(ph))*.18*(sp?1:.2);p.rotation.z=Math.sin(ph)*.06*(sp?1:.2);p.rotation.y=-.35});
 if(sp&&Math.random()<.4){const d=new THREE.Mesh(new THREE.SphereGeometry(.08,6,4),new THREE.MeshBasicMaterial({color:'#e8d8b8',transparent:true,opacity:.6}));d.position.set(X-rnd(0,3),.1,rnd(-.6,.8));sc.add(d);dust.push({m:d,l:0})}
 for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.l+=dt;d.m.position.y+=dt*.4;d.m.material.opacity=.6*(1-d.l);d.m.scale.setScalar(1+d.l*2);if(d.l>1){sc.remove(d.m);dust.splice(i,1)}}
 ground.children.forEach(g=>{const e=g.userData.ev;if(e){e.position.y=2.4+Math.sin(T*2+g.userData.i)*.2;if(X>e.position.x&&!e.userData.pop){e.userData.pop=1;e.material.opacity=1}if(e.userData.pop){e.scale.multiplyScalar(1+dt*2);e.material.opacity=Math.max(0,e.material.opacity-dt*1.5)}}});
 const zi=Math.floor((X+1)/SEG),b=BI[zi%BI.length];if(zi!==ZN){ZN=zi;$('zn').textContent=b[0];$('zone').style.opacity=0;setTimeout(()=>$('zone').style.opacity=1,150)}
 sky.set(b[1]);sc.background=(sc.background||new THREE.Color()).lerp(sky,dt*1.5);sc.fog.color.copy(sc.background);
 cam.position.set(X+2.5,3.4,10.5);cam.lookAt(X+1,1.4,0);
 const pc=DONE?100:Math.round(PROG*100);$('pc').textContent=pc+' %';$('bar').firstElementChild.style.width=pc+'%';
 if(DONE&&X>=target-.5&&!arrived){arrived=1;$('arr').style.opacity=1}
 R.render(sc,cam)}
requestAnimationFrame(frame);
addEventListener('message',e=>{const m=e.data||{};if(m.t!='voyage')return;if(m.team)setTeam(m.team);if(m.zones&&m.zones.length){m.zones.forEach((z,i)=>{if(BI[i])BI[i][0]=z})}PROG=Math.max(0,Math.min(1,m.prog||0));DONE=m.done?1:0;$('tm').textContent=m.left||'';if(DONE){X=Math.max(X,TOTAL*SEG-30)}});
try{parent.postMessage({t:'voyage-ready'},'*')}catch(e){}
</script></body></html>
