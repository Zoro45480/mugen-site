<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="640" height="400"></canvas>
<script>
/* SERVEUR TEST · tuiles du menu : scènes anime peintes (ciel, silhouettes, lanternes, lumière, particules) — sans cartes */
const C=document.getElementById('c'),g=C.getContext('2d'),W=640,H=400;
let seed=1;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;const rr=(a,b)=>a+R()*(b-a);
function sky(a,b,c,d){const q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,a);q.addColorStop(.5,b);q.addColorStop(.8,c);q.addColorStop(1,d||c);g.fillStyle=q;g.fillRect(0,0,W,H)}
function stars(n=120,a=.8){for(let i=0;i<n;i++){g.globalAlpha=rr(.2,a);g.fillStyle='#fff';const s=R()<.08?2:1;g.fillRect(rr(0,W),rr(0,H*.55),s,s)}g.globalAlpha=1}
function glow(x,y,r,col,a=1){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,col);q.addColorStop(1,'transparent');g.globalAlpha=a;g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2);g.globalAlpha=1}
function orb(x,y,r,col,halo){glow(x,y,r*4,halo||col,.55);g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function moon(x,y,r){orb(x,y,r,'#fff6e0','#9ab8ff');g.fillStyle='#e8dcc0';g.globalAlpha=.35;[[.3,-.2,.18],[-.25,.25,.12],[.1,.35,.09]].forEach(([a,b,s])=>{g.beginPath();g.arc(x+a*r,y+b*r,s*r,0,7);g.fill()});g.globalAlpha=1}
function rays(x,y,col,n=18,a=.08){g.save();g.translate(x,y);for(let i=0;i<n;i++){g.rotate(Math.PI*2/n);g.globalAlpha=a*rr(.5,1.3);g.fillStyle=col;g.beginPath();g.moveTo(0,0);g.lineTo(W,-28);g.lineTo(W,28);g.fill()}g.restore();g.globalAlpha=1}
function mount(base,amp,col,n=6,peak){g.fillStyle=col;g.beginPath();g.moveTo(0,H);g.lineTo(0,base);for(let i=0;i<=n;i++){const x=i/n*W;g.lineTo(x-W/n/2,base-rr(amp*.3,amp)*(peak&&i==Math.round(n/2)?1.8:1));g.lineTo(x,base-rr(0,amp*.4))}g.lineTo(W,H);g.fill()}
function fuji(x,base,w,h,col){g.fillStyle=col;g.beginPath();g.moveTo(x-w,base);g.lineTo(x-w*.12,base-h);g.lineTo(x+w*.12,base-h);g.lineTo(x+w,base);g.fill();g.fillStyle='#f4f0ff';g.beginPath();g.moveTo(x-w*.12,base-h);g.lineTo(x+w*.12,base-h);g.lineTo(x+w*.3,base-h*.62);g.lineTo(x+w*.12,base-h*.7);g.lineTo(x,base-h*.6);g.lineTo(x-w*.14,base-h*.7);g.lineTo(x-w*.3,base-h*.62);g.fill()}

function roof(x,y,w,h,col){g.fillStyle=col;g.beginPath();g.moveTo(x-w*.62,y+h*.25);g.quadraticCurveTo(x-w*.4,y+h*.05,x-w*.3,y-h*.15);g.lineTo(x+w*.3,y-h*.15);g.quadraticCurveTo(x+w*.4,y+h*.05,x+w*.62,y+h*.25);g.lineTo(x+w*.5,y+h*.3);g.lineTo(x-w*.5,y+h*.3);g.fill()}

function lantern(x,y,r,col,str=1){if(str){g.strokeStyle='#0008';g.lineWidth=1;g.beginPath();g.moveTo(x,y-r*1.4);g.lineTo(x,y-r*3);g.stroke()}glow(x,y,r*5,col,.5);const q=g.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r*1.2);q.addColorStop(0,'#fff6d0');q.addColorStop(.5,col);q.addColorStop(1,'#5a1000');g.fillStyle=q;g.beginPath();g.ellipse(x,y,r*.85,r*1.1,0,0,7);g.fill();g.fillStyle='#2a1008';g.fillRect(x-r*.5,y-r*1.2,r,r*.22);g.fillRect(x-r*.5,y+r*.98,r,r*.22)}
function string(x1,y1,x2,y2,n,col,r=7){g.strokeStyle='#0009';g.lineWidth=1.2;g.beginPath();g.moveTo(x1,y1);g.quadraticCurveTo((x1+x2)/2,Math.max(y1,y2)+30,x2,y2);g.stroke();for(let i=1;i<n;i++){const t=i/n,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t+Math.sin(t*Math.PI)*30*.75;lantern(x,y+r*1.3,r,col,0)}}

function neonSign(x,y,txt,col,size=70){g.font=`900 ${size}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.shadowColor=col;g.shadowBlur=30;g.fillStyle=col;g.fillText(txt,x,y);g.shadowBlur=12;g.fillStyle='#fff';g.fillText(txt,x,y);g.shadowBlur=0}
