<style>

function clearArena(){AR.clear();ARU=[];AMB=null}
const ARENES={
 feuille:{n:'VILLAGE CACHÉ DES FEUILLES',u:'Univers Naruto',k:'木',build(){
  sc.background=sky([[0,'#1c1640'],[.45,'#6a2a5a'],[.7,'#ff7a45'],[.82,'#ffb36a'],[1,'#3a1a10']]);sc.fog.color.set(0x5a2a3a);sc.fog.density=.022;

   const hm=M(i%3?0xd8c0a0:0xc8a880,{map:winTex('#ffcf7a','#c8b090',3,3)});const b=add(new THREE.Mesh(new THREE.BoxGeometry(w,h,w),hm),Math.cos(a)*-r,h/2,-Math.sin(a)*r,rnd(0,3));

   add(new THREE.Mesh(new THREE.CylinderGeometry(.2,.35,h,7),M(0x4a3020)),x,h/2,z);for(let k=0;k<3;k++)add(new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(1.2,2),0),M(k%2?0x3a7a24:0x4f9a2c,{flatShading:true})),x+rnd(-.8,.8),h+rnd(-.3,.9),z+rnd(-.8,.8))}

 mer:{n:'GRAND LINE · PONT DU NAVIRE',u:'Univers One Piece',k:'海',build(){

 maudit:{n:'TOKYO · ZONE MAUDITE',u:'Univers Jujutsu Kaisen',k:'呪',build(){
  sc.background=sky([[0,'#05020a'],[.5,'#1a0624'],[.75,'#4a0a2a'],[.85,'#200614'],[1,'#05020a']]);sc.fog.color.set(0x1a0620);sc.fog.density=.03;

 foret:{n:'FORÊT DES GLYCINES',u:'Univers Demon Slayer',k:'鬼',build(){
  sc.background=sky([[0,'#03040e'],[.5,'#0c1430'],[.78,'#2a2050'],[.9,'#120c24'],[1,'#03040a']]);sc.fog.color.set(0x141a34);sc.fog.density=.04;
