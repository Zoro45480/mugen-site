/* Maquette : les trois grimoires (3, 4 et 5 feuilles). Tout est calculé à partir du temps : seek(t) donne exactement la même image à chaque fois.

  g.save();g.translate(w/2,h*.83);g.lineWidth=4;g.strokeStyle=or;g.beginPath();g.moveTo(-230,0);g.lineTo(-40,0);g.moveTo(40,0);g.lineTo(230,0);g.stroke();g.rotate(PI/4);g.fillStyle=emOnly?o.em:or;g.fillRect(-16,-16,32,32);g.restore()}})}
const pageT=o=>tex(512,700,(g,w,h)=>{const rd=rng(o.n*31+7);g.fillStyle=o.n==5?'#d8cdb8':'#f1e7cf';g.fillRect(0,0,w,h);const v=g.createLinearGradient(0,0,w,0);v.addColorStop(0,'#0003');v.addColorStop(.12,'#0000');v.addColorStop(1,'#0001');g.fillStyle=v;g.fillRect(0,0,w,h);

function book(o){const B=new THREE.Group(),std=(m,em)=>new THREE.MeshStandardMaterial({map:m,roughness:.62,metalness:.25,emissiveMap:em||null,emissive:em?new THREE.Color(o.em):new THREE.Color(0),emissiveIntensity:0});

 const back=new THREE.Mesh(new THREE.BoxGeometry(W,H,.07),mats(cB));back.position.z=-TK/2;back.rotation.y=PI;B.add(back);

 const blk=new THREE.Mesh(new THREE.BoxGeometry(W*.94,H*.95,TK*.8),new THREE.MeshStandardMaterial({color:o.n==5?0xb8ad98:0xe8dcc0,roughness:.9}));blk.position.x=-.02;B.add(blk);
 const hinge=new THREE.Group();hinge.position.set(-W/2,0,TK/2);B.add(hinge);const fg=new THREE.BoxGeometry(W,H,.07);fg.translate(W/2,0,0);const front=new THREE.Mesh(fg,mats(cF));hinge.add(front);

 const pt=pageT(o),pm=new THREE.MeshStandardMaterial({map:pt,roughness:.9,side:2,emissive:new THREE.Color(o.em),emissiveIntensity:0}),pages=[...Array(14)].map((_,i)=>{const h=new THREE.Group();h.position.set(-W/2+.03,0,TK*.4-i*.004);const g=new THREE.PlaneGeometry(W*.92,H*.93,10,1);g.translate(W*.46,0,0);const m=new THREE.Mesh(g,pm);h.add(m);B.add(h);return {h,m,g,p0:g.attributes.position.array.slice()}});

 const cg=new THREE.CylinderGeometry(1.5,.5,9,40,1,true);cg.translate(0,4.5,0);const colM=new THREE.ShaderMaterial({uniforms:{c:{value:new THREE.Color(o.em)},a:{value:0},t:{value:0}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:2,
  vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 c;uniform float a,t;varying vec2 vU;void main(){float s=.6+.4*sin(vU.x*60.+t*3.+vU.y*8.);float f=pow(1.-vU.y,1.6);gl_FragColor=vec4(c*(.5+s*.7),a*f*(.35+s*.4));}'}),col=new THREE.Mesh(cg,colM);col.rotation.x=PI/2;col.position.z=.2;B.add(col);

 /* particules : des signes lumineux qui montent des pages */
 const N=260,pp=new Float32Array(N*3),pgm=new THREE.BufferGeometry();pgm.setAttribute('position',new THREE.BufferAttribute(pp,3));const rd=rng(o.n*13+3),seeds=[...Array(N)].map(()=>[rd(),rd(),rd(),rd()]);
 const pts=new THREE.Points(pgm,new THREE.PointsMaterial({map:glowT,color:o.em,size:.16,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));B.add(pts);
 B.visible=false;sc.add(B);return {B,o,hinge,front:cF,clasp,pages,pm,light,col,colM,sig,pts,pp,seeds}}
const books=G.map(book);
sc.add(new THREE.HemisphereLight(0xffffff,0x202028,.55));const key=new THREE.DirectionalLight(0xfff0e0,2.2);key.position.set(3,5,6);sc.add(key);const rim=new THREE.DirectionalLight(0x88aaff,1.1);rim.position.set(-5,2,-4);sc.add(rim);
const bgT=G.map(o=>tex(16,512,(g,w,h)=>{const l=g.createLinearGradient(0,0,0,h);l.addColorStop(0,o.bg[0]);l.addColorStop(.6,o.bg[1]);l.addColorStop(1,o.bg[2]);g.fillStyle=l;g.fillRect(0,0,w,h)}));

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),sm=x=>{x=cl(x);return x*x*(3-2*x)},eo=x=>1-Math.pow(1-cl(x),3);
const SEG=6.2;window.DUR=SEG*3;

 const fin=cl((u-.0)/.5)*(1-cl((u-(SEG-.5))/.5));$('t').style.opacity=cl((u-.6)/.6)*(1-cl((u-(SEG-.6))/.5));$('ts').textContent=o.sous;$('ts').style.color=o.em;$('tn').textContent=o.nom;$('tn').style.color=o.em;$('td').textContent=o.d;

 b.hinge.rotation.y=-open*PI*.94;b.front.emissiveIntensity=sm((u-.5)/.9)*1.6*(1-open*.5)+Math.sin(t*5)*.15*sm((u-.5)/.9);b.clasp.position.x=W/2+.04+eo((u-1.3)/.3)*.5;b.clasp.visible=u<1.7;
 b.pages.forEach((p,k)=>{const q=sm((u-2.1-k*.085)/.5);p.h.rotation.y=-q*PI*.93*(1-k*.004);const a=p.g.attributes.position.array,bend=Math.sin(q*PI)*.5;for(let v=0;v<a.length;v+=3){const x=p.p0[v]/(W*.92);a[v+2]=Math.sin(x*PI)*bend}p.g.attributes.position.needsUpdate=true;p.h.visible=open>.02});
 b.pm.emissiveIntensity=mag*.35;b.light.intensity=mag*26+sm((u-.5)/.9)*5;b.colM.uniforms.a.value=mag*.9*fin;b.colM.uniforms.t.value=t;b.col.scale.set(.6+mag*.5,.2+mag*.9,.6+mag*.5);
 b.sig.material.opacity=sm((u-3.3)/.8)*.9*fin;b.sig.scale.setScalar(1.2+sm((u-3.3)/1.4)*1.5);b.sig.position.set(-W*.5,0,2.2+sm((u-3.3)/1.4)*1.4);b.sig.material.rotation=t*.5;

{const gi=Math.max(0,Math.min(2,(+new URLSearchParams(location.search).get('g')||3)-3)),t0=performance.now(),L=SEG-2;(function f(){requestAnimationFrame(f);const t=(performance.now()-t0)/1000,k=t%(2*L);seek(gi*SEG+1+(k<L?k:2*L-k))})()}
