function shot(a,b,col,dur,size,done){const s=glow(col,size,a.x,a.y,a.z,1),c=glow('#ffffff',size*.45,a.x,a.y,a.z,1);fx(dur,t=>{const e=t*t;s.position.lerpVectors(a,b,e);s.position.y+=Math.sin(e*PI)*.9;c.position.copy(s.position);if(Math.random()<.8){const q=s.position.clone(),tr=glow(col,size*.5,q.x,q.y,q.z,.7);fx(.3,k=>{tr.material.opacity=.7*(1-k);tr.scale.setScalar(size*.5*(1-k))},()=>sc.remove(tr))}},()=>{sc.remove(s);sc.remove(c);done&&done()})}
function hitFoe(col,big){shake=big?.45:.22;punch=big?1:.4;burst(FP,col,big?34:16,big?5:3.2);ring(FP.clone().setY(.08),col,big?7:4);ring(FP,'#ffffff',big?4.5:2.6,0);pl.color.set(col);pl.intensity=big?260:140;fx(.45,t=>{foe.position.x=FP.x+Math.sin(t*40)*(1-t)*(big?.45:.22);foe.rotation.z=Math.sin(t*26)*(1-t)*.16;fm.color.setRGB(1,.35+t*.65,.35+t*.65);pl.intensity=60+(1-t)*(big?200:80)},()=>{foe.position.x=FP.x;foe.rotation.z=0;fm.color.setRGB(1,1,1);pl.color.copy(C);pl.intensity=60})}
function page(col,done){const m=new THREE.Mesh(new THREE.PlaneGeometry(.8,1.1),new THREE.MeshBasicMaterial({color:0xfff3d8,side:2,transparent:true}));m.position.copy(BP);sc.add(m);const top=BP.clone().add(V3(.5,1.7,-.6));fx(.3,t=>{m.position.lerpVectors(BP,top,t);m.rotation.set(-.85+t*.9,t*5,t*.6);m.material.color.lerpColors(new THREE.Color(0xfff3d8),new THREE.Color(col),t)},()=>{sc.remove(m);burst(top,col,8,1.6);done(top)})}
const ACT={
 play(m){const col=m.col||'#ffffff',id=m.id;page(col,top=>{if(id=='soin'){ring(BP.clone().setY(.1),'#5ae08a',4);for(let i=0;i<3;i++)setTimeout(()=>burst(BP.clone().add(V3(0,.6,0)),'#5ae08a',10,2),i*120)}
   else if(id=='bouclier'){const s=add(new THREE.Mesh(new THREE.SphereGeometry(2,28,18),new THREE.MeshBasicMaterial({color:0x5ab8ff,transparent:true,opacity:.0,blending:THREE.AdditiveBlending,depthWrite:false,wireframe:false})),BP.x,BP.y+.2,BP.z);fx(1.1,t=>{s.material.opacity=Math.sin(t*PI)*.3;s.scale.setScalar(.6+t*.5)},()=>sc.remove(s));ring(BP.clone().setY(.1),'#5ab8ff',4.5)}
   else if(id=='mana'){for(let i=0;i<14;i++){const a=BP.clone().add(V3((Math.random()-.5)*6,Math.random()*4,(Math.random()-.5)*4));shot(a,BP.clone().add(V3(0,.4,0)),'#5ab8ff',.45,.35)}}
   else if(id=='double'){shot(top,FP,col,.26,1,()=>hitFoe(col));setTimeout(()=>shot(top,FP,col,.26,1,()=>hitFoe(col)),200)}
   else if(id=='brulure')shot(top,FP,col,.3,1.1,()=>{hitFoe(col);ACT.burn()})
   else if(id=='drain')shot(top,FP,col,.3,1.2,()=>{hitFoe(col);shot(FP.clone(),BP.clone().add(V3(0,.5,0)),'#5ae08a',.4,.8,()=>ring(BP.clone().setY(.1),'#5ae08a',3))})
   else{const big=id=='lourd'||id=='ultime';shot(top,FP,col,big?.36:.28,big?(id=='ultime'?2.6:1.9):1.1,()=>hitFoe(col,big))}})},
 foe(m){if(m.k=='soin'){ring(FP.clone().setY(.1),'#5ae08a',4.5);burst(FP,'#5ae08a',20,2.4);return}if(m.k=='rien')return;const big=m.k=='gros',from=FP.clone().add(V3(-.4,.3,.6));fx(.22,t=>{foe.position.z=FP.z+Math.sin(t*PI)*.9});
  shot(from,BP.clone().add(V3(0,.5,0)),TH[0],big?.42:.3,big?2.4:1.1,()=>{shake=big?.6:.25;burst(BP.clone().add(V3(0,.5,0)),TH[0],big?30:12,big?4.5:2.6);const f=document.getElementById('fl');fx(.5,t=>{f.style.opacity=(1-t)*(big?.75:.4);bk.position.x=BP.x+Math.sin(t*38)*(1-t)*.2},()=>{f.style.opacity=0;bk.position.x=BP.x})})},
 anti(){const X=[1,-1].map(s=>{const p=add(new THREE.Mesh(new THREE.PlaneGeometry(.28,5.2),new THREE.MeshBasicMaterial({color:0xff1a2a,transparent:true,blending:THREE.AdditiveBlending,side:2,depthWrite:false})),FP.x,FP.y,FP.z+.4);p.rotation.z=s*PI/4;return p});shake=.4;burst(FP,'#ff1a2a',26,4);fx(.8,t=>{X.forEach(p=>{p.material.opacity=1-t;p.scale.x=1+t*2});faura.material.opacity=.5*t},()=>X.forEach(p=>sc.remove(p)))},
 burn(){for(let i=0;i<10;i++){const p=FP.clone().add(V3((Math.random()-.5)*2,-1.6+Math.random()*.5,.4)),s=glow(i%2?'#ff7a2a':'#ffd36a',.8,p.x,p.y,p.z,.9);fx(.7,t=>{s.position.y=p.y+t*2.2;s.material.opacity=.9*(1-t)},()=>sc.remove(s))}},
 end(m){if(m.w){burst(FP,TH[0],40,6);fx(1,t=>{foe.rotation.x=-t*1.5;foe.position.y=FP.y-t*1.6;faura.material.opacity=.5*(1-t);fpad.material.opacity=.8*(1-t)})}else fx(1,t=>{bk.position.y=BP.y-t*2.5;bglow.material.opacity=.45*(1-t);bl.intensity=5*(1-t)})}};
addEventListener('message',e=>{const m=e.data||{};if(typeof m.t!='string'||m.t.slice(0,4)!='grx-')return;const k=m.t.slice(4);if(k=='init')return loadFoe(m.img,m.k);try{ACT[k]&&ACT[k](m)}catch(x){console.warn(x)}});
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;const k=Math.min(1,f.t/f.dur);try{f.f&&f.f(k)}catch(x){}if(k>=1){FX.splice(i,1);try{f.done&&f.done()}catch(x){}}}
 foe.position.y=(foe.rotation.x?foe.position.y:FP.y+Math.sin(T*1.5)*.07);fpad.rotation.z+=dt*.6;bk.position.y+=(Math.sin(T*1.8)*.004);bglow.material.opacity=Math.min(bglow.material.opacity,.45+Math.sin(T*3)*.08);G.rotation.y=Math.sin(T*.3)*.05;
 shake*=Math.pow(.004,dt);punch*=Math.pow(.01,dt);cam.position.set(CP.x+Math.sin(T*.35)*.25+(Math.random()-.5)*shake,CP.y+(Math.random()-.5)*shake,CP.z-punch*.9);cam.lookAt(CL);R.render(sc,cam)}
requestAnimationFrame(frame);window.pret=1;window.ACT=ACT;try{parent.postMessage({t:'grx-ready'},'*')}catch(e){}
</script></body></html>
