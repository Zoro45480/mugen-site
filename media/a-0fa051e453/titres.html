<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUGEN · Titres 3D</title>
<style>
:root{--bg:#07060c;--tx:#f3eefc;--mu:#a59cbd;--bd:#ffffff1c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% -10%,#2a0d3a,#0b0612 55%,#05040a);color:var(--tx);font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 30px}
.prof{position:relative;border-radius:24px;border:1px solid var(--bd);background:linear-gradient(135deg,#1a1028cc,#0c0914cc);padding:22px 26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;overflow:hidden}
.av{width:96px;height:96px;border-radius:50%;background:conic-gradient(from 0deg,#ff7a45,#ff3d6e,#7c4dff,#ff7a45);padding:3px}
.av canvas{width:100%;height:100%;border-radius:50%;display:block;background:#140a20}
.who small{font:800 11px ui-monospace,monospace;letter-spacing:4px;color:#ffd36a}
.who h1{font-size:28px;font-weight:900;margin:2px 0 8px}
.who .meta{display:flex;gap:8px;flex-wrap:wrap}.who .meta span{font:700 11px ui-monospace,monospace;padding:5px 9px;border-radius:8px;background:#ffffff0c;border:1px solid var(--bd);color:#ddd}
.feat{grid-column:1/3;height:150px;position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:#07050c}
.sec{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin:22px 4px 12px}.sec b{white-space:nowrap}.sec b{font-size:18px}.sec small{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tp{position:relative;height:118px;border-radius:16px;overflow:hidden;border:1px solid var(--bd);background:#0a0710;cursor:pointer;perspective:600px}
.tp.sel{box-shadow:0 0 0 2px #fff,0 0 26px var(--a)}
.tp canvas,.feat canvas{position:absolute;inset:0;width:100%;height:100%}
.tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-style:preserve-3d;pointer-events:none}
.tt .k{position:absolute;font:900 86px serif;opacity:.13;color:var(--a);transform:translateZ(-30px)}
.tt b{position:relative;font-weight:900;font-style:italic;font-size:21px;letter-spacing:1px;text-align:center;line-height:1.05;padding:0 10px;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:200% 200%}
.tw{display:grid;transform-style:preserve-3d}.tw>*{grid-area:1/1}
.tt .ex{font-weight:900;font-style:italic;font-size:21px;letter-spacing:1px;text-align:center;line-height:1.05;padding:0 10px;color:var(--d);text-shadow:var(--ext);transform:translateZ(-2px)}
.feat .tt .ex{font-size:46px}
.tt small{font:800 9px ui-monospace,monospace;letter-spacing:3px;color:var(--a);margin-top:6px;opacity:.85}
.feat .tt b{font-size:46px}.feat .tt small{font-size:11px;letter-spacing:5px}.feat .tt .k{font-size:180px}
.rr{position:absolute;top:8px;right:9px;font:800 8.5px ui-monospace,monospace;letter-spacing:1.5px;padding:3px 7px;border-radius:999px;border:1px solid var(--a);color:var(--a);background:#0008}
.cur{position:fixed;z-index:9;width:22px;height:22px;pointer-events:none;display:none}
@media (max-width:760px){.tt .ex{font-size:15px}.feat .tt .ex{font-size:28px}.prof{grid-template-columns:1fr;padding:16px;text-align:center}.av{margin:0 auto;width:76px;height:76px}.who .meta{justify-content:center}.feat{grid-column:1;height:120px}.feat .tt b{font-size:28px}.grid{grid-template-columns:1fr 1fr;gap:10px}.tp{height:100px}.tt b{font-size:15px}}
</style></head><body>
<div class="wrap">
 <div class="prof">
  <div class="av"><canvas id="av" width="200" height="200"></canvas></div>
  <div class="who"><small>PROFIL · 称号</small><h1>Kaito</h1><div class="meta"><span>Niveau 103</span><span>2 365 victoires</span><span>Classé · Maître</span><span>12 / 26 titres</span></div></div>
  <div class="feat" id="feat"></div>
 </div>
 <div class="sec"><b>Mes titres</b><small>Maquette · touche un titre pour l’afficher sur ton profil</small></div>
 <div class="grid" id="grid"></div>
</div>
<svg class="cur" id="cur" viewBox="0 0 24 24"><path d="M3 2l7 19 3-8 8-3z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>
<script>
const REC=location.search.includes('rec');const $=id=>document.getElementById(id);const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
// titres repris du jeu (TTL) : nom, kanji, univers, couleurs [clair, principal, sombre, accent], effet
const TT=[
 {n:'MONARQUE DES OMBRES',k:'影',s:'SOLO LEVELING',c:['#e5dbff','#9775fa','#1a0b3a','#845ef7'],fx:'shadow',r:'MYTHIQUE'},
 {n:'LE PLUS FORT',k:'無',s:'JUJUTSU KAISEN',c:['#e7f5ff','#74c0fc','#1c2a6a','#4dabf7'],fx:'void',r:'DIVIN'},
 {n:'ROI DES PIRATES',k:'王',s:'ONE PIECE',c:['#fff1a8','#ffb000','#6a3a05','#ffd34d'],fx:'gold',r:'LÉGENDAIRE'},
 {n:'HOKAGE',k:'火',s:'NARUTO',c:['#ffe8cc','#ff7a1a','#7a2a05','#ff922b'],fx:'fire',r:'ÉPIQUE'},
 {n:'SUPER GUERRIER',k:'超',s:'DRAGON BALL',c:['#fffbe0','#ffd34d','#7a5200','#ffe066'],fx:'bolt',r:'LÉGENDAIRE'},
 {n:'POURFENDEUR',k:'滅',s:'DEMON SLAYER',c:['#9fe3ff','#2b8fd9','#0b2d4a','#4dc3ff'],fx:'wave',r:'ÉPIQUE'},
 {n:'ROI DES FLÉAUX',k:'呪',s:'JUJUTSU KAISEN',c:['#ffd9de','#ff2a3a','#3a0008','#ff2a3a'],fx:'blood',r:'MYTHIQUE'},
 {n:'SHINIGAMI',k:'死',s:'BLEACH',c:['#ffffff','#a5d8ff','#111318','#74c0fc'],fx:'ice',r:'RARE'},
 {n:'DÉMON TRONÇONNEUSE',k:'鋸',s:'CHAINSAW MAN',c:['#ffe8cc','#ff922b','#5c1d00','#ff922b'],fx:'spark',r:'ÉPIQUE'},
 {n:'DIEU DU NOUVEAU MONDE',k:'神',s:'DEATH NOTE',c:['#ffffff','#ced4da','#1a1a1a','#fa5252'],fx:'page',r:'MYTHIQUE'},
 {n:'CHASSEUR D’ÉLITE',k:'念',s:'HUNTER X HUNTER',c:['#ebfbee','#69db7c','#0b3d1a','#51cf66'],fx:'nen',r:'RARE'},
 {n:'CHAMPION DE LA SEMAINE',k:'冠',s:'TOURNOI HEBDOMADAIRE',c:['#fff6d0','#ffc414','#5a3a00','#ffe066'],fx:'crown',r:'MONARQUE'}];
function ext(dark,n){let s=[];for(let i=1;i<=n;i++)s.push(`${i*.6}px ${i}px 0 ${dark}`);s.push(`0 ${n+4}px 14px #000c`);return s.join(',')}
function plate(t,big){const el=document.createElement('div');el.className=big?'':'tp';el.style.setProperty('--a',t.c[3]);el.style.setProperty('--d',t.c[2]);el.style.setProperty('--ext',ext(t.c[2],big?9:5));
 el.innerHTML=`<canvas></canvas><div class="tt"><span class="k">${t.k}</span><span class="tw"><span class="ex">${t.n}</span><b style="background-image:linear-gradient(100deg,${t.c[0]} 0%,${t.c[1]} 30%,${t.c[0]} 45%,${t.c[3]} 60%,${t.c[0]} 75%,${t.c[1]} 100%)">${t.n}</b></span><small>${t.s}</small></div>${big?'':`<span class="rr">${t.r}</span>`}`;
 return {el,t,cv:el.querySelector('canvas'),tt:el.querySelector('.tt'),b:el.querySelector('b'),P:[],big,ph:rnd(0,6)}}
const P=[];const grid=$('grid');TT.forEach((t,i)=>{const p=plate(t,false);p.i=i;grid.append(p.el);P.push(p);p.el.onclick=()=>pick(i)});
let F=null;function pick(i){const f=$('feat');f.innerHTML='';F=plate(TT[i],true);f.append(F.el.firstChild);while(F.el.firstChild)f.append(F.el.firstChild);F.cv=f.querySelector('canvas');F.tt=f.querySelector('.tt');F.b=f.querySelector('b');f.style.setProperty('--a',TT[i].c[3]);f.style.setProperty('--d',TT[i].c[2]);f.style.setProperty('--ext',ext(TT[i].c[2],9));P.forEach(p=>p.el.classList.toggle('sel',p.i==i))}
pick(0);
// avatar
(()=>{const g=$('av').getContext('2d');const r=g.createRadialGradient(100,90,5,100,90,110);r.addColorStop(0,'#b388ff');r.addColorStop(1,'#140a20');g.fillStyle=r;g.fillRect(0,0,200,200);g.translate(100,215);g.scale(.32,.32);g.fillStyle='#0b0612';g.beginPath();g.moveTo(-190,0);g.bezierCurveTo(-170,-200,-120,-300,-70,-330);g.lineTo(-60,-390);g.bezierCurveTo(-90,-430,-95,-500,-60,-540);for(let i=0;i<7;i++){const a=-2.6+i*.36;g.lineTo(Math.cos(a)*(i%2?70:130),-520+Math.sin(a)*(i%2?70:120))}g.bezierCurveTo(95,-500,90,-430,60,-390);g.lineTo(70,-330);g.bezierCurveTo(120,-300,170,-200,190,0);g.fill();g.fillStyle='#b388ff';g.beginPath();g.ellipse(-26,-455,14,6,-.25,0,7);g.ellipse(26,-455,14,6,.25,0,7);g.fill()})();
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function fx(p,dt,T){const c=p.cv,W=c.width=c.clientWidth,H=c.height=c.clientHeight;if(!W)return;const g=c.getContext('2d'),t=p.t,[c0,c1,c2,c3]=t.c,S=p.big?1.6:1;
 const bg=g.createRadialGradient(W/2,H/2,5,W/2,H/2,W*.6);bg.addColorStop(0,hexA(c2,.95));bg.addColorStop(1,'#07050c');g.fillStyle=bg;g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';
 const spawn=(n,f)=>{let k=n*dt*60;while(k>0){if(Math.random()<k)p.P.push(f());k--}};
 if(t.fx=='fire'){spawn(1.2*S,()=>({x:rnd(0,W),y:H+5,vx:rnd(-8,8),vy:-rnd(30,70),l:0,m:rnd(1,2),r:rnd(2,5)*S,h:rnd(15,40)}))}
 if(t.fx=='gold'||t.fx=='crown'){spawn(.7*S,()=>({x:rnd(0,W),y:rnd(0,H),vx:0,vy:-rnd(4,12),l:0,m:rnd(.8,1.6),r:rnd(1.5,3)*S,h:45,star:1}))}
 if(t.fx=='ice'){spawn(.6*S,()=>({x:rnd(0,W),y:-4,vx:rnd(-6,6),vy:rnd(14,30),l:0,m:rnd(2,4),r:rnd(1,2.5)*S,h:200,s:'90%'}))}
 if(t.fx=='blood'){spawn(.25*S,()=>({x:rnd(0,W),y:-2,vx:0,vy:rnd(20,50),l:0,m:rnd(1.5,3),r:rnd(1.5,3)*S,h:355,drip:1}))}
 if(t.fx=='spark'){spawn(1.4*S,()=>{const a=rnd(-2.6,-.5);return{x:W*.5+rnd(-W*.3,W*.3),y:H*.75,vx:Math.cos(a)*rnd(60,140),vy:Math.sin(a)*rnd(60,140),l:0,m:rnd(.3,.7),r:1.4*S,h:30,line:1,gr:220}})}
 if(t.fx=='page'){spawn(.18*S,()=>({x:rnd(0,W),y:-10,vx:rnd(-10,10),vy:rnd(12,22),l:0,m:rnd(3,5),r:7*S,h:0,pg:1,ro:rnd(0,6)}))}
 if(t.fx=='shadow'){spawn(.9*S,()=>({x:rnd(0,W),y:H+8,vx:rnd(-5,5),vy:-rnd(10,25),l:0,m:rnd(1.5,3),r:rnd(8,16)*S,h:265,smk:1}))}
 if(t.fx=='void'){for(let i=0;i<70*S;i++){const a=i*2.399+T*.25,r=(i/(70*S))*W*.6;g.fillStyle=hexA(i%3?c1:'#ffffff',.5);g.fillRect(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r*.45,1.6,1.6)}
  g.strokeStyle=hexA(c3,.5);g.lineWidth=2;g.beginPath();g.ellipse(W/2,H/2,W*.18+Math.sin(T*2)*4,H*.32,0,0,7);g.stroke()}
 if(t.fx=='wave'){g.lineWidth=2.2*S;for(let j=0;j<4;j++){g.strokeStyle=hexA(j%2?c0:c3,.35);g.beginPath();for(let x=0;x<=W;x+=6){const y=H*(.3+j*.15)+Math.sin(x*.025+T*2.2+j)*8*S;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}}
 if(t.fx=='nen'){for(let j=0;j<3;j++){const r=((T*.5+j/3)%1);g.strokeStyle=hexA(c3,.6*(1-r));g.lineWidth=3;g.beginPath();g.ellipse(W/2,H/2,W*.5*r+20,H*.6*r+10,0,0,7);g.stroke()}}
 if(t.fx=='bolt'&&Math.random()<dt*5){p.bolt={x:rnd(W*.15,W*.85),l:.12}}
 if(p.bolt&&p.bolt.l>0){p.bolt.l-=dt;g.strokeStyle=hexA('#ffffff',.9);g.shadowColor=c3;g.shadowBlur=14;g.lineWidth=2*S;g.beginPath();let x=p.bolt.x,y=0;g.moveTo(x,y);while(y<H){x+=rnd(-12,12);y+=rnd(8,16);g.lineTo(x,y)}g.stroke();g.shadowBlur=0}
 if(t.fx=='bolt'){const a=g.createRadialGradient(W/2,H/2,5,W/2,H/2,W*.45);a.addColorStop(0,hexA(c3,.25+Math.sin(T*9)*.08));a.addColorStop(1,'transparent');g.fillStyle=a;g.fillRect(0,0,W,H)}
 if(t.fx=='crown'){for(let i=0;i<10;i++){const a=i/10*6.283+T*.6;g.fillStyle=hexA(c3,.35);g.beginPath();g.moveTo(W/2,H/2);g.arc(W/2,H/2,W,a,a+.08);g.fill()}}
 p.P=p.P.filter(q=>{q.l+=dt;const f=1-q.l/q.m;if(f<=0)return false;if(q.gr)q.vy+=q.gr*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
  if(q.line){g.strokeStyle=`hsla(${q.h},100%,65%,${f})`;g.lineWidth=q.r;g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x-q.vx*.04,q.y-q.vy*.04);g.stroke();return true}
  if(q.pg){g.save();g.translate(q.x,q.y);g.rotate(q.ro+q.l);g.fillStyle=`rgba(240,240,240,${.5*f})`;g.fillRect(-q.r,-q.r*1.3,q.r*2,q.r*2.6);g.fillStyle=`rgba(250,82,82,${.5*f})`;g.fillRect(-q.r*.6,-q.r*.8,q.r*1.2,1.5);g.restore();return true}
  if(q.smk){g.globalCompositeOperation='source-over';const r=g.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r);r.addColorStop(0,`hsla(${q.h},70%,45%,${.35*f})`);r.addColorStop(1,'transparent');g.fillStyle=r;g.fillRect(q.x-q.r,q.y-q.r,q.r*2,q.r*2);g.globalCompositeOperation='lighter';return true}
  if(q.drip){g.fillStyle=`hsla(${q.h},90%,45%,${f})`;g.beginPath();g.ellipse(q.x,q.y,q.r*.7,q.r*1.4,0,0,7);g.fill();return true}
  const r=g.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*2.4);r.addColorStop(0,`hsla(${q.h},${q.s||'100%'},70%,${f})`);r.addColorStop(1,'transparent');g.fillStyle=r;g.fillRect(q.x-q.r*3,q.y-q.r*3,q.r*6,q.r*6);
  if(q.star){g.fillStyle=`rgba(255,255,255,${f})`;g.fillRect(q.x-q.r*2,q.y-.5,q.r*4,1);g.fillRect(q.x-.5,q.y-q.r*2,1,q.r*4)}return true});
 g.globalCompositeOperation='source-over';
 // titre 3D : inclinaison + reflet qui balaie
 const rx=Math.sin(T*.9+p.ph)*8,ry=Math.sin(T*.7+p.ph*1.3)*14;p.tt.style.transform=`rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
 p.b.style.backgroundPosition=`${((T*25+p.ph*30)%200).toFixed(1)}% 50%`;
 if(t.fx=='bolt')p.b.style.filter=`drop-shadow(0 0 ${6+Math.abs(Math.sin(T*9))*8}px ${c3})`;else p.b.style.filter=`drop-shadow(0 0 6px ${hexA(c3,.45)})`}
let T=0;const Q=[];const at=(t,f)=>Q.push({t,f});const cur=$('cur');
function curTo(el){const r=el.getBoundingClientRect();cur.style.display='block';cur.style.left=(r.left+r.width*.5)+'px';cur.style.top=(r.top+r.height*.55)+'px'}
window.DEMO=()=>new Promise(res=>{let t=T+1.5;[3,4,1,6,2,11,9,0].forEach(i=>{at(t-.45,()=>curTo(P[i].el));at(t,()=>pick(i));t+=1.8});at(t,()=>{cur.style.display='none';res()})});
function step(dt){T+=dt;for(let i=Q.length-1;i>=0;i--)if(T>=Q[i].t){const f=Q[i].f;Q.splice(i,1);f()}P.forEach(p=>fx(p,dt,T));if(F)fx(F,dt,T)}
window.STEP=step;
if(!REC){let l=performance.now();const f=n=>{requestAnimationFrame(f);step(Math.min(.05,(n-l)/1000));l=n};requestAnimationFrame(f)}
</script></body></html>
