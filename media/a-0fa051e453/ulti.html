 const H=a.G.position.clone().add(V(.5,3.8,0));const orb=glowS(col,.4);orb.position.copy(H);keep(orb);await camTo(V(-2.2,2.6,7),H,.25,ease.o);await tween(.45,t=>orb.scale.setScalar(.4+t*1.6));
