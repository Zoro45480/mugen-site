{const pm=new THREE.PMREMGenerator(R);const e=new THREE.Scene();e.add(new THREE.HemisphereLight(0xffffff,0x443366,2));const b=new THREE.Mesh(new THREE.SphereGeometry(5,16,8),new THREE.MeshBasicMaterial({color:0x8877aa,side:THREE.BackSide}));e.add(b);sc.environment=pm.fromScene(e).texture}

 add(new THREE.CylinderGeometry(.34,.36,.1,32),M('#c2182b',{roughness:.35,metalness:.2,emissive:'#5a0010',emissiveIntensity:.6}),[.55,-1.02,.62],[Math.PI/2-.25,0,0],1,g);
