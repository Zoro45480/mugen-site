AKQ.konan=[async(a,d)=>{/* Mer de papier : une vague de feuilles qui déferle */const E=EP(d),ap=EP(a),N=380,P=new THREE.InstancedMesh(new THREE.PlaneGeometry(.2,.3),new THREE.MeshStandardMaterial({color:'#f6f2ea',side:2,roughness:.7}),N);P.frustumCulled=false;keep(P);const O=new THREE.Object3D(),S=[...Array(N)].map(()=>[rnd(-1,1),rnd(0,1),rnd(-1,1),rnd(0,6)]);

 async(a,d)=>{/* Ange de papier : ailes de papier et pluie de shuriken de papier */const E=EP(d),ap=EP(a);const wt=ctex('wing',DRAW.wing),w1=plane(wt,2.6,2.6,{normal:true}),w2=plane(wt,2.6,2.6,{normal:true});w1.position.copy(ap).add(V(-.9,.6,-.3));w2.position.copy(ap).add(V(.9,.6,-.3));w2.scale.x=-1;keep(w1);keep(w2);
